<!doctype html><html><head><meta charset="utf-8"><title>v06_table_layout</title><style>body{font-family:sans-serif;margin:20px}.row,.g,.form-group{margin:8px 0}label{margin-right:8px}.pill{border:1px solid #888;padding:2px 10px;border-radius:12px;cursor:pointer}</style></head><body><table>
<tr><td>Last Name</td><td><input name="b"></td></tr>
<tr><td>First Name</td><td><input name="a" data-truth="firstname"></td></tr>

<tr><td>State</td><td><select name="s" data-truth="state"><option>-- Select Country --</option><option>Afganistan</option><option>Argentina</option><option>Australia</option><option>Bangladesh</option><option>Canada</option><option>Egypt</option><option>India</option><option>Japan</option><option>Kenya</option></select></td></tr></table></body></html>
