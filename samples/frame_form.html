<!doctype html><html><head><meta charset="utf-8"></head><body><form>
<div class="form-group row"><label class="col-2" for="fname">First Name</label><div class="col-10"><input type="text" id="fname" name="fname" class="form-control" placeholder="First Name" data-truth="firstname"></div></div>
<div class="form-group row"><label class="col-2" for="lname">Last Name</label><div class="col-10"><input type="text" id="lname" name="lname" class="form-control" placeholder="Last Name"></div></div>

</form></body></html>
