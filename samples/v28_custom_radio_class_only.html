<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:sans-serif;margin:20px}.dd{position:relative;display:inline-block}.dropdown-menu{list-style:none;margin:0;padding:0;border:1px solid #888;display:none}.dd.open .dropdown-menu{display:block}.dropdown-menu li{padding:3px 8px;cursor:pointer}</style></head><body><form onsubmit="return false"><style>.r.on{background:#cfc}</style><div><label>First Name</label> <input type=text data-truth=firstname></div><div><label>Gender</label> <span class=r data-truth=decoy onclick="this.classList.toggle('on')">Male</span> <span class=r data-truth=female onclick="document.querySelectorAll('.r').forEach(x=>x.classList.remove('on'));this.classList.add('selected')" role=radio>Female</span></div><div><label>State</label> <select data-truth=state><option value="">-- Select Country --</option><option>Afganistan</option><option>India</option><option>Japan</option><option>Kenya</option></select></div></form></body></html>
