<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:sans-serif;margin:20px}.dd{position:relative;display:inline-block}.dropdown-menu{list-style:none;margin:0;padding:0;border:1px solid #888;display:none}.dd.open .dropdown-menu{display:block}.dropdown-menu li{padding:3px 8px;cursor:pointer}</style></head><body><form onsubmit="return false"><div><label>First Name</label> <input type=text data-truth=firstname></div><div><label>Gender</label> <label><input type="radio" name="g" value="Male"> Male</label> <label><input type="radio" name="g" value="Female" data-truth="female"> Female</label></div><div><label>State of Birth</label> <select data-truth=decoy><option value="">-- Select Country --</option><option>Afganistan</option><option>India</option><option>Japan</option><option>Kenya</option></select></div><div><label>State</label> <div class="dd" onclick="this.classList.toggle('open')"><button type="button" class="dropdown-toggle" data-truth="state-trigger" id="sbtn">-- Select --</button><ul class="dropdown-menu"><li data-truth="state-option" onclick="document.getElementById('sbtn').textContent=this.textContent">Afganistan</li><li data-truth="state-option" onclick="document.getElementById('sbtn').textContent=this.textContent">India</li><li data-truth="state-option" onclick="document.getElementById('sbtn').textContent=this.textContent">Japan</li></ul></div></div></form></body></html>
